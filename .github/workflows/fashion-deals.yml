
name: Fashion Deal Hunter - Verificare catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read

jobs:
  verifica-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Descarca fisierele proiectului
        uses: actions/checkout@v4

      - name: Configureaza Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verifica produsele
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("products.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          products = data.get("products")
          if not isinstance(products, list):
              raise ValueError("Catalogul trebuie sa contina o lista products")

          print(f"Catalog valid. Produse existente: {len(products)}")
          print("Nu au fost adaugate produse fictive.")
          PY
      - name: Testeaza accesul la ABOUT YOU
        run: python aboutyou_test.py
